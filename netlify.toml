# Netlify Configuration File
# Place this in the root of your repository

[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/updates"
  to = "/updates.html"
  status = 200

[[redirects]]
  from = "/announcement"
  to = "/announcement.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
